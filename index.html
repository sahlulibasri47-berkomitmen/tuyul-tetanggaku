
    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Parkir Odong-Odong - Game Bang Sahlul</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #2d3436;
            color: white;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
            overflow: hidden;
        }
        h1 { color: #fdcb6e; text-shadow: 2px 2px 4px black; font-size: 20px; }
        #gameArea {
            width: 300px;
            height: 500px;
            background: #636e72;
            border: 3px solid #fdcb6e;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
        }
        #odong {
            width: 40px;
            height: 70px;
            background: #e17055;
            position: absolute;
            left: 130px;
            top: 400px;
            border-radius: 5px;
            transition: all 0.3s;
            border: 2px solid white;
        }
        #odong::before {
            content: '🏍️';
            font-size: 30px;
            position: absolute;
            top: 15px;
            left: 5px;
            transform: rotate(90deg);
        }
        #parkir {
            width: 60px;
            height: 90px;
            background: rgba(253, 203, 110, 0.3);
            border: 3px dashed #fdcb6e;
            position: absolute;
            left: 120px;
            top: 20px;
        }
        .tembok {
            position: absolute;
            background: #2d3436;
            border: 1px solid #636e72;
        }
        #controls {
            width: 300px;
            margin: 10px auto;
            display: flex;
            justify-content: space-between;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: #fdcb6e;
            color: #2d3436;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
        }
        #info { font-size: 16px; }
        #startBtn {
            padding: 10px 20px;
            font-size: 16px;
            background: #e17055;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>🏍️ PARKIR ODONG-ODONG 🏍️</h1>
    <div id="info">Nyawa: <span id="nyawa">3</span> | Waktu: <span id="waktu">60</span>s</div>
    <div id="gameArea">
        <div id="parkir"></div>
        <div id="odong"></div>
        <!-- Tembok penghalang -->
        <div class="tembok" style="left:0;top:150px;width:100px;height:20px;"></div>
        <div class="tembok" style="left:200px;top:150px;width:100px;height:20px;"></div>
        <div class="tembok" style="left:0;top:300px;width:80px;height:20px;"></div>
        <div class="tembok" style="left:220px;top:300px;width:80px;height:20px;"></div>
    </div>
    <div id="controls">
        <button class="btn" ontouchstart="gerak('kiri')" onclick="gerak('kiri')">◀</button>
        <button class="btn" ontouchstart="gerak('maju')" onclick="gerak('maju')">▲</button>
        <button class="btn" ontouchstart="gerak('mundur')" onclick="gerak('mundur')">▼</button>
        <button class="btn" ontouchstart="gerak('kanan')" onclick="gerak('kanan')">▶</button>
    </div>
    <button id="startBtn" onclick="mulaiGame()">MULAI NARIK</button>
    <p style="margin-top:10px; font-size:12px;">Game by Bang Sahlul © 2026</p>

    <script>
        let odong = document.getElementById('odong');
        let parkir = document.getElementById('parkir');
        let gameArea = document.getElementById('gameArea');
        let x = 130, y = 400, nyawa = 3, waktu = 60, gameJalan = false;
        let timerGame;
        
        function mulaiGame() {
            x = 130; y = 400; nyawa = 3; waktu = 60; gameJalan = true;
            odong.style.left = x + 'px';
            odong.style.top = y + 'px';
            document.getElementById('nyawa').textContent = nyawa;
            document.getElementById('waktu').textContent = waktu;
            document.getElementById('startBtn').style.display = 'none';
            
            timerGame = setInterval(() => {
                waktu--;
                document.getElementById('waktu').textContent = waktu;
                if (waktu <= 0) gameOver('Waktu habis! Penumpang kabur bang 😂');
            }, 1000);
        }

        function gerak(arah) {
            if (!gameJalan) return;
            let step = 15;
            let newX = x, newY = y;
            
            if (arah === 'kiri') newX -= step;
            if (arah === 'kanan') newX += step;
            if (arah === 'maju') newY -= step;
            if (arah === 'mundur') newY += step;
            
            // Cek nabrak tembok
            if (newX < 0 || newX > 260 || newY < 0 || newY > 430) {
                nabrak();
                return;
            }
            
            // Cek tembok penghalang
            let temboks = document.getElementsByClassName('tembok');
            for (let t of temboks) {
                let tX = t.offsetLeft, tY = t.offsetTop, tW = t.offsetWidth, tH = t.offsetHeight;
                if (newX < tX + tW && newX + 40 > tX && newY < tY + tH && newY + 70 > tY) {
                    nabrak();
                    return;
                }
            }
            
            x = newX; y = newY;
            odong.style.left = x + 'px';
            odong.style.top = y + 'px';
            
            // Cek berhasil parkir
            let pX = parkir.offsetLeft, pY = parkir.offsetTop;
            if (x > pX - 5 && x < pX + 25 && y > pY - 5 && y < pY + 25) {
                gameOver('GOKIL! PARKIR SEMPURNA! Abang sopir terbaik se-Banda Aceh! 🏆');
            }
        }
        
        function nabrak() {
            nyawa--;
            document.getElementById('nyawa').textContent = nyawa;
            navigator.vibrate(200);
            if (nyawa <= 0) gameOver('DUAR! NABRAK TERUS! Odong-odong ringsek bang 😂');
        }

        function gameOver(pesan) {
            gameJalan = false;
            clearInterval(timerGame);
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('startBtn').textContent = 'NARIK LAGI';
            alert(pesan);
        }
    </script>
</body>
</html>
